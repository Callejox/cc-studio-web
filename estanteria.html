<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La estantería · Archivo de proyectos — CC Studio</title>
<meta name="description" content="El archivo de proyectos de CC Studio como una biblioteca 3D: cada web que hemos construido es un libro en la estantería.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* ============================================================
     La estantería — biblioteca 3D del archivo de proyectos
     Minimalismo editorial cálido: papel crema, nogal y serifa.
     ============================================================ */
  :root {
    --paper:  #F2EBDD;
    --ink:    #2B241C;
    --muted:  #8A7E6C;
    --walnut: #5C4432;
    --foil:   #A98B54;
    --accent: #5B8BB0;
    --serif:  Georgia, 'Times New Roman', serif;
    --mono:   ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --sans:   'Inter', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--sans); overflow: hidden;
  }
  canvas#shelf { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  ::selection { background: var(--foil); color: #fff; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  .mono { font-family: var(--mono); font-size: .68rem; letter-spacing: .14em; }

  /* Barra superior */
  .bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px clamp(18px, 3vw, 36px);
    pointer-events: none;
  }
  .bar > * { pointer-events: auto; }
  .brand {
    display: flex; align-items: baseline; gap: 8px; text-decoration: none;
    color: var(--ink); font-weight: 700; font-size: 1.15rem; letter-spacing: -.04em;
    font-family: 'Poppins', sans-serif;
  }
  .brand b { color: var(--accent); }
  .brand small { font-family: var(--mono); font-size: .58rem; letter-spacing: .32em; font-weight: 400; color: var(--muted); }
  .bar__back {
    text-decoration: none; color: var(--ink);
    font-family: var(--mono); font-size: .7rem; letter-spacing: .1em;
    border: 1px solid rgba(43,36,28,.25); border-radius: 999px; padding: 9px 16px;
    background: rgba(242,235,221,.7); backdrop-filter: blur(6px);
    transition: border-color .2s;
  }
  .bar__back:hover { border-color: var(--ink); }

  /* Título editorial */
  .masthead {
    position: fixed; top: clamp(64px, 10vh, 96px); left: 0; right: 0; z-index: 5;
    text-align: center; pointer-events: none;
  }
  .masthead .mono { color: var(--muted); }
  .masthead h1 {
    font-family: var(--serif); font-weight: 400; font-style: italic;
    font-size: clamp(1.7rem, 3.4vw, 2.7rem); letter-spacing: .01em;
    color: var(--ink); margin-top: 6px;
  }

  /* Pista de uso */
  .hint {
    position: fixed; bottom: 104px; left: 50%; transform: translateX(-50%);
    z-index: 5; color: var(--muted); pointer-events: none;
    transition: opacity .6s ease; text-align: center;
  }
  .hint.off { opacity: 0; }

  /* Navegación inferior: flechas + marcadores */
  .dock {
    position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; align-items: center; gap: 18px;
  }
  .dock__btn {
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid rgba(43,36,28,.3); background: rgba(242,235,221,.8);
    color: var(--ink); font-size: 1rem; cursor: pointer;
    transition: border-color .2s, transform .2s;
  }
  .dock__btn:hover { border-color: var(--ink); transform: translateY(-2px); }
  .markers { display: flex; gap: 12px; }
  .marker {
    width: 12px; height: 12px; border-radius: 50%;
    border: 1px solid rgba(43,36,28,.45); background: transparent; cursor: pointer;
    transition: background .25s, transform .25s;
  }
  .marker:hover { transform: scale(1.3); }
  .marker.on { background: var(--ink); border-color: var(--ink); }

  /* Libro abierto: doble página (web navegable + servicios) */
  .spread {
    position: fixed; inset: 0; z-index: 20;
    display: grid; place-items: center; padding: clamp(12px, 3vw, 40px);
    opacity: 0; visibility: hidden;
    transition: opacity .5s ease, visibility .5s;
  }
  .spread.open { opacity: 1; visibility: visible; }
  .spread__veil {
    position: absolute; inset: 0;
    background: rgba(236,227,209,.78);
    backdrop-filter: blur(7px);
  }
  .spread__book {
    position: relative; z-index: 1;
    width: min(1120px, 96vw); height: min(660px, 84vh);
    display: grid; grid-template-columns: 1fr 1fr;
    background: #FBF7EE;
    border-radius: 8px;
    box-shadow:
      0 40px 90px -30px rgba(43,36,28,.55),
      0 2px 0 #EFE5CF, 0 4px 0 #E7DCC4, 0 6px 0 #DFD3B9;   /* canto de páginas */
    transform: scale(.94) translateY(14px);
    transition: transform .5s cubic-bezier(.22,1,.36,1);
  }
  .spread.open .spread__book { transform: none; }
  /* lomo central */
  .spread__book::before {
    content: ''; position: absolute; inset: 0 auto 0 50%; width: 46px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, rgba(43,36,28,.14) 46%, rgba(43,36,28,.22) 50%, rgba(43,36,28,.14) 54%, transparent);
    pointer-events: none; z-index: 2;
  }
  .page { padding: clamp(16px, 2.2vw, 30px); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .page .mono { color: var(--foil); }
  .page--web iframe {
    flex: 1; width: 100%; min-height: 0;
    border: 1px solid rgba(43,36,28,.2); border-radius: 3px;
    background: #fff; margin-top: 12px;
  }
  .page--info { border-left: 1px solid rgba(43,36,28,.08); overflow: auto; }
  .page--info h2 {
    font-family: var(--serif); font-weight: 400; font-size: clamp(1.6rem, 2.6vw, 2.2rem);
    line-height: 1.1; margin: 10px 0 12px; color: var(--ink);
  }
  .page--info .desc { font-family: var(--serif); font-style: italic; font-size: .98rem; color: #55493A; line-height: 1.6; }
  .svc { list-style: none; margin-top: 18px; display: grid; gap: 10px; }
  .svc li {
    position: relative; padding-left: 22px;
    font-size: .9rem; color: var(--ink);
  }
  .svc li::before {
    content: ''; position: absolute; left: 0; top: 8px;
    width: 10px; height: 10px; transform: rotate(45deg);
    border: 1px solid var(--foil);
  }
  .page__rule { height: 1px; background: linear-gradient(90deg, var(--foil), transparent); margin-top: 18px; opacity: .5; }
  .page__actions { display: flex; gap: 10px; margin-top: auto; padding-top: 18px; }
  .page__visit {
    text-decoration: none; background: var(--ink); color: var(--paper);
    font-size: .84rem; font-weight: 600; padding: 12px 22px; border-radius: 999px;
    transition: transform .2s;
  }
  .page__visit:hover { transform: translateY(-2px); }
  .page__close {
    border: 1px solid rgba(43,36,28,.3); background: transparent; color: var(--ink);
    font-size: .82rem; padding: 12px 18px; border-radius: 999px; cursor: pointer;
    transition: border-color .2s;
  }
  .page__close:hover { border-color: var(--ink); }

  @media (max-width: 860px) {
    .spread__book {
      grid-template-columns: 1fr; height: min(88vh, 940px);
      grid-template-rows: 1.15fr auto;
    }
    .spread__book::before { display: none; }
    .page--info { border-left: 0; border-top: 1px solid rgba(43,36,28,.1); }
  }
  @media (max-width: 640px) {
    .masthead h1 { font-size: 1.5rem; }
    .hint { bottom: 150px; width: 90vw; }
  }
  @media (prefers-reduced-motion: reduce) {
    .spread, .spread__book, .hint, .dock__btn, .marker, .page__visit { transition: none; }
  }
</style>
</head>
<body>

<canvas id="shelf" aria-label="Estantería 3D con los proyectos del estudio como libros. Usa las flechas para recorrerla y los marcadores para saltar a cada proyecto." role="img"></canvas>

<header class="bar">
  <a class="brand" href="index.html">CC<b>.</b><small>STUDIO</small></a>
  <a class="bar__back" href="index.html#works">← volver a la web</a>
</header>

<div class="masthead">
  <span class="mono">[ 01 ]  ( archivo de proyectos )</span>
  <h1>La estantería completa</h1>
</div>

<p class="hint mono" id="hint">arrastra · rueda · flechas — toca un tomo para abrirlo</p>

<nav class="dock" aria-label="Recorrer la estantería">
  <button class="dock__btn" id="prev" aria-label="Retroceder">←</button>
  <div class="markers" id="markers" role="group" aria-label="Proyectos"></div>
  <button class="dock__btn" id="next" aria-label="Avanzar">→</button>
</nav>

<div class="spread" id="spread" role="dialog" aria-modal="true" aria-label="Proyecto abierto">
  <div class="spread__veil" id="spreadVeil"></div>
  <div class="spread__book">
    <div class="page page--web">
      <span class="mono" id="sNum">( la web, en vivo — puedes scrollear )</span>
      <iframe id="sFrame" src="about:blank" title="Vista previa navegable de la web del proyecto" loading="lazy"></iframe>
    </div>
    <div class="page page--info">
      <span class="mono">( lo que hicimos )</span>
      <h2 id="sTitle"></h2>
      <p class="desc" id="sDesc"></p>
      <ul class="svc" id="sSvc"></ul>
      <div class="page__rule"></div>
      <div class="page__actions">
        <a class="page__visit" id="sLink" href="#" target="_blank" rel="noopener">Ver web ↗</a>
        <button class="page__close" id="sClose">Cerrar ✕</button>
      </div>
    </div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';

/* ---------- datos ---------- */
const PROJECTS = [
  { num:'01', title:'La Brisa Salou', url:'https://labrisasalou.com', img:'img/portfolio/labrisa.webp', cloth:'#77897C',
    svc:['Diseño y construcción web','Carta digital con QR','SEO local','GEO — visibilidad en buscadores de IA','Ficha de Google Business','Mantenimiento'] },
  { num:'02', title:'Rent a Boat Salou', url:'https://rentaboatsalou.com', img:'img/portfolio/rentaboat-salou.webp', cloth:'#5B7A96',
    svc:['Diseño y construcción web','Gestor de reservas a medida','Web en 4 idiomas (ES·EN·FR·CA)','SEO local + GEO','Analítica propia sin cookies','Automatización de operaciones'] },
  { num:'03', title:'Boat 4 Rent', url:'https://boat4renttarragona.com', img:'img/portfolio/boat4rent.webp', cloth:'#55617A',
    svc:['Diseño y construcción web','Catálogo de flota','Tarifas y disponibilidad online','SEO local','GEO — visibilidad en buscadores de IA'] },
  { num:'04', title:'Pizzería Da Luca', url:'https://pizzeriadaluca.es', img:'img/portfolio/daluca.webp', cloth:'#9C6B4F',
    svc:['Diseño y construcción web','Carta digital','Pedidos a domicilio','SEO local','Ficha de Google Business'] },
  { num:'05', title:'Le Massage', url:'https://lemassage.es', img:'img/portfolio/lemassage.webp', cloth:'#87707F',
    svc:['Diseño y construcción web','Sistema de reservas online','Email marketing','Publicidad — Meta y Google Ads','SEO local + GEO'] },
];
const DESCS = [
  'Restaurante del paseo de Salou: una carta digital que se abre con QR y un SEO local pensado para llenar mesas.',
  'Alquiler de barcos con reservas en tiempo real, web en cuatro idiomas y analítica propia sin cookies.',
  'Flota, catálogo y tarifas online para el alquiler náutico en Tarragona.',
  'Pizzería de barrio con carta digital y pedidos a domicilio directamente desde su web.',
  'Centro de masajes con reservas online, mailing a clientas y campañas de publicidad.',
];
const DECOYS = ['#8C8474','#6E7B72','#A89A7E','#75655A','#5E6B63','#93857B','#6B6255','#7E8B95','#9A8D97','#556058','#8B7D62','#77706B','#63707C','#867B6B'];
const REAL_SLOTS = [0, 1, 2, 3, 4];                // cada libro ES un proyecto
const FOIL = '#B9975B', PAPER_EDGE = '#EFE5CF';

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DUR = reduce ? 0 : 0.7;

let seed = 20260729 >>> 0;
const rand = () => {
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};

/* ---------- texturas de tela con lienzo 2D ---------- */
function clothBase(ctx, w, h, color) {
  ctx.fillStyle = color; ctx.fillRect(0, 0, w, h);
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 14;
    d[i] += n; d[i+1] += n; d[i+2] += n;
  }
  ctx.putImageData(img, 0, 0);
}
function makeSpine(book) {
  const c = document.createElement('canvas'); c.width = 128; c.height = 512;
  const x = c.getContext('2d');
  clothBase(x, 128, 512, book.cloth);
  x.strokeStyle = FOIL; x.fillStyle = FOIL; x.lineWidth = 2;
  x.strokeRect(14, 16, 100, 480);
  if (book.project) {
    x.save(); x.translate(64, 256); x.rotate(Math.PI / 2);
    x.font = 'italic 34px Georgia, serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(book.project.title, 0, 0); x.restore();
    x.font = '20px Georgia, serif'; x.textAlign = 'center';
    x.fillText(book.project.num, 64, 52);
    x.beginPath(); x.arc(64, 470, 7, 0, Math.PI * 2); x.stroke();
  } else {
    const m = Math.floor(rand() * 3);
    x.beginPath();
    if (m === 0) { x.arc(64, 90, 16, 0, Math.PI * 2); x.arc(64, 422, 16, 0, Math.PI * 2); }
    if (m === 1) { x.moveTo(34, 100); x.lineTo(94, 100); x.moveTo(34, 412); x.lineTo(94, 412); }
    if (m === 2) { x.moveTo(64, 74); x.lineTo(84, 100); x.lineTo(64, 126); x.lineTo(44, 100); x.closePath(); }
    x.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
function makeCover(book) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 640;
  const x = c.getContext('2d');
  clothBase(x, 512, 640, book.cloth);
  x.strokeStyle = FOIL; x.fillStyle = FOIL; x.lineWidth = 3;
  x.strokeRect(26, 26, 460, 588);
  x.lineWidth = 1; x.strokeRect(38, 38, 436, 564);
  if (book.project) {
    x.font = 'italic 44px Georgia, serif'; x.textAlign = 'center';
    x.fillText(book.project.title, 256, 110, 400);
    x.font = '16px Georgia, serif';
    x.fillText('— CC STUDIO —', 256, 580);
    // lámina con la captura de la web (se dibuja al cargar)
    const img = new Image();
    img.onload = () => {
      const fw = 360, fh = 340, fx = (512 - fw) / 2, fy = 160;
      x.fillStyle = PAPER_EDGE; x.fillRect(fx - 8, fy - 8, fw + 16, fh + 16);
      const s = Math.max(fw / img.width, fh / img.height);
      const sw = fw / s, sh = fh / s;
      x.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, fx, fy, fw, fh);
      x.strokeStyle = FOIL; x.lineWidth = 3; x.strokeRect(fx - 8, fy - 8, fw + 16, fh + 16);
      t.needsUpdate = true;
    };
    img.src = book.project.img;
  } else {
    x.beginPath(); x.lineWidth = 2;
    const m = Math.floor(rand() * 3);
    if (m === 0) x.arc(256, 320, 90, 0, Math.PI * 2);
    if (m === 1) { x.moveTo(256, 210); x.lineTo(366, 320); x.lineTo(256, 430); x.lineTo(146, 320); x.closePath(); }
    if (m === 2) { for (let i = 0; i < 4; i++) { x.moveTo(150, 250 + i * 50); x.lineTo(362, 250 + i * 50); } }
    x.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}

/* ---------- escena ---------- */
const canvas = document.getElementById('shelf');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#F2EBDD');
scene.fog = new THREE.Fog('#F2EBDD', 6, 12);

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 30);

scene.add(new THREE.HemisphereLight(0xfff6e8, 0x9a8a74, 1.05));
const sun = new THREE.DirectionalLight(0xffeed8, 1.6);
sun.position.set(2.5, 4, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

/* libros */
const books = [];
let cursor = 0;
const GAP = 0;                                      // pegados del todo
for (let i = 0, di = 0; i < PROJECTS.length; i++) {
  const slot = i;
  const project = PROJECTS[i];
  const h = 1.14 + rand() * 0.1;
  const w = 0.34 + rand() * 0.07;                   // tomos bien anchos
  const d = 0.7 + rand() * 0.06;
  const book = { project, cloth: project ? project.cloth : DECOYS[di++ % DECOYS.length] };
  const cloth = new THREE.MeshStandardMaterial({ color: book.cloth, roughness: 0.85 });
  const pages = new THREE.MeshStandardMaterial({ color: PAPER_EDGE, roughness: 0.9 });
  const cover = new THREE.MeshStandardMaterial({ map: makeCover(book), roughness: 0.82 });
  const spine = new THREE.MeshStandardMaterial({ map: makeSpine(book), roughness: 0.82 });
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    [cover, cloth, pages, cloth, spine, pages]   // +x -x +y -y +z -z
  );
  mesh.castShadow = true; mesh.receiveShadow = true;
  const g = new THREE.Group();
  g.add(mesh);
  g.position.set(cursor + w / 2, h / 2, 0);
  cursor += w + GAP;
  g.userData = { project, baseX: g.position.x, baseY: g.position.y, w, h, mesh, slot };
  scene.add(g);
  books.push(g);
}
const shelfLen = cursor;

/* sujetalibros de nogal a ambos lados */
for (const bx of [-0.09, shelfLen + 0.09 - GAP]) {
  const end = new THREE.Mesh(
    new THREE.BoxGeometry(0.09, 0.62, 0.78),
    new THREE.MeshStandardMaterial({ color: '#4A3628', roughness: 0.6 })
  );
  end.position.set(bx, 0.31, 0);
  end.castShadow = true;
  scene.add(end);
}

/* estantería de nogal */
const walnut = new THREE.MeshStandardMaterial({ color: '#5C4432', roughness: 0.6 });
const board = new THREE.Mesh(new THREE.BoxGeometry(shelfLen + 1.6, 0.07, 1.05), walnut);
board.position.set(shelfLen / 2, -0.035, -0.02);
board.receiveShadow = true;
scene.add(board);
const lip = new THREE.Mesh(new THREE.BoxGeometry(shelfLen + 1.6, 0.30, 0.06), walnut);
lip.position.set(shelfLen / 2, -0.22, 0.44);
scene.add(lip);
const wall = new THREE.Mesh(
  new THREE.PlaneGeometry(shelfLen + 14, 10),
  new THREE.MeshStandardMaterial({ color: '#EDE4D2', roughness: 1 })
);
wall.position.set(shelfLen / 2, 2, -0.62);
wall.receiveShadow = true;
scene.add(wall);

/* ---------- estado ---------- */
let scroll = books[REAL_SLOTS[0]].userData.baseX, scrollT = scroll;
const minX = books[0].userData.baseX, maxX = books[books.length - 1].userData.baseX;
let mode = 'browse';                 // 'browse' | 'inspect'
let selected = null, hovered = null;
let zoomT = 1.35;
const zoomBase = () => innerWidth < innerHeight ? 1.75 : 1.35;   // en vertical, más aire

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(-2, -2);
/* gancho de depuración (inocuo en producción) */
window.__shelf = { books, camera, pointer, raycaster, state: () => ({ mode, hovered: hovered?.userData?.project?.title ?? null, scroll, scrollT, dragMoved }) };

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize, { passive: true });
resize();

/* ---------- interacción ---------- */
const hint = document.getElementById('hint');
let hinted = false;
const useHint = () => { if (!hinted) { hinted = true; hint.classList.add('off'); } };

let dragging = false, dragMoved = 0, px = 0, py = 0;
canvas.addEventListener('pointerdown', e => {
  dragging = true; dragMoved = 0; px = e.clientX; py = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  if (!dragging) return;
  const dx = e.clientX - px, dy = e.clientY - py;
  px = e.clientX; py = e.clientY;
  dragMoved += Math.abs(dx) + Math.abs(dy);
  if (mode === 'browse') { scrollT = clamp(scrollT - dx * 0.004, minX, maxX); useHint(); }
  else if (selected) {
    selected.rotation.y += dx * 0.008;
    selected.rotation.x = clamp(selected.rotation.x + dy * 0.005, -0.5, 0.5);
  }
});
const endDrag = () => { dragging = false; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (mode === 'browse') {
    scrollT = clamp(scrollT + (e.deltaY + e.deltaX) * 0.0016, minX, maxX);
    useHint();
  } else {
    zoomT = clamp(zoomT + e.deltaY * 0.0012, 0.85, 1.9);
  }
}, { passive: false });

addEventListener('keydown', e => {
  if (e.key === 'Escape' && mode === 'inspect') closeBook();
  if (mode !== 'browse') return;
  if (e.key === 'ArrowRight') { scrollT = clamp(scrollT + 0.55, minX, maxX); useHint(); }
  if (e.key === 'ArrowLeft')  { scrollT = clamp(scrollT - 0.55, minX, maxX); useHint(); }
});

canvas.addEventListener('click', () => {
  if (dragMoved > 6) return;                       // era un arrastre
  if (mode === 'inspect') return;
  if (hovered) openBook(hovered);
});

document.getElementById('prev').addEventListener('click', () => { if (mode === 'browse') scrollT = clamp(scrollT - 0.9, minX, maxX); });
document.getElementById('next').addEventListener('click', () => { if (mode === 'browse') scrollT = clamp(scrollT + 0.9, minX, maxX); });

/* marcadores */
const markersEl = document.getElementById('markers');
const markerBtns = PROJECTS.map((p, i) => {
  const b = document.createElement('button');
  b.className = 'marker'; b.title = p.title; b.setAttribute('aria-label', p.title);
  b.addEventListener('click', () => {
    if (mode === 'inspect') closeBook();
    scrollT = books[REAL_SLOTS[i]].userData.baseX;
    useHint();
  });
  markersEl.appendChild(b);
  return b;
});

/* ---------- abrir / cerrar libro (doble página) ---------- */
const spread = document.getElementById('spread');
const sFrame = document.getElementById('sFrame');
function openBook(g) {
  mode = 'inspect'; selected = g;
  const p = g.userData.project;
  document.getElementById('sTitle').textContent = p.title;
  document.getElementById('sDesc').textContent = DESCS[g.userData.slot];
  document.getElementById('sLink').href = p.url;
  const svc = document.getElementById('sSvc');
  svc.innerHTML = '';
  p.svc.forEach(s => {
    const li = document.createElement('li');
    li.textContent = s;
    svc.appendChild(li);
  });
  scrollT = g.userData.baseX;
  /* el tomo sale del estante y, al llegar, el libro se abre en doble página */
  gsap.to(g.position, { x: g.userData.baseX, y: 0.85, z: 1.1, duration: DUR, ease: 'power3.out' });
  gsap.to(g.rotation, { y: -Math.PI / 2 + 0.1, x: 0.05, duration: DUR, ease: 'power3.out',
    onComplete: revealSpread });
  if (reduce) revealSpread();
}
function revealSpread() {
  if (mode !== 'inspect' || !selected) return;
  sFrame.src = selected.userData.project.url;      // la web real, navegable
  spread.classList.add('open');
  document.getElementById('sClose').focus();
}
function closeBook() {
  const g = selected; if (!g) return;
  spread.classList.remove('open');
  sFrame.src = 'about:blank';                       // descargar la web al cerrar
  gsap.to(g.position, { x: g.userData.baseX, y: g.userData.baseY, z: 0, duration: DUR, ease: 'power3.inOut' });
  gsap.to(g.rotation, { x: 0, y: 0, duration: DUR, ease: 'power3.inOut',
    onComplete: () => { mode = 'browse'; selected = null; } });
  if (reduce) { mode = 'browse'; selected = null; }
}
document.getElementById('sClose').addEventListener('click', closeBook);
document.getElementById('spreadVeil').addEventListener('click', closeBook);
window.__shelf.open = openBook;
window.__shelf.close = closeBook;

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ---------- bucle ---------- */
let running = true;
document.addEventListener('visibilitychange', () => {
  running = document.visibilityState === 'visible';
  if (running) tick();
});

function tick() {
  if (!running) return;
  requestAnimationFrame(tick);

  const k = reduce ? 1 : 0.09;
  scroll += (scrollT - scroll) * k;

  const aspectFix = Math.max(1, 1.25 / camera.aspect);   // en vertical, aleja para ver más tomos
  const camZ = (mode === 'inspect' ? 2.05 * zoomT : 3.35) * aspectFix;
  const camY = mode === 'inspect' ? 0.8 : 0.85;
  camera.position.set(scroll, camY, camZ);
  camera.lookAt(scroll, mode === 'inspect' ? 0.76 : 0.48, 0);
  sun.position.set(scroll + 2.5, 4, 3);
  sun.target.position.set(scroll, 0, 0);
  sun.target.updateMatrixWorld();

  /* hover con raycast (solo en browse) */
  if (mode === 'browse') {
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(books.map(b => b.userData.mesh));
    const g = hits.length ? hits[0].object.parent : null;
    const target = g && g.userData.project ? g : null;
    if (target !== hovered) {
      if (hovered) gsap.to(hovered.position, { z: 0, duration: 0.35, ease: 'power2.out' });
      hovered = target;
      if (hovered) gsap.to(hovered.position, { z: 0.14, duration: 0.35, ease: 'power2.out' });
      canvas.style.cursor = hovered ? 'pointer' : 'grab';
    }
    /* marcador activo = proyecto más cercano */
    let ni = 0, nd = 1e9;
    REAL_SLOTS.forEach((s, i) => {
      const d = Math.abs(books[s].userData.baseX - scroll);
      if (d < nd) { nd = d; ni = i; }
    });
    markerBtns.forEach((b, i) => b.classList.toggle('on', i === ni));
  }

  renderer.render(scene, camera);
}
tick();
</script>
